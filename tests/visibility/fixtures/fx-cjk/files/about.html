<h1>私たちについて</h1>
<p>港町ロースターズは、二〇一六年に横浜の山下町で開業しました。会社勤めの後にコーヒーの世界へ入った店主が、一人で始めた焙煎所です。</p>
<img src="/img/owner.jpg" alt="店主の佐藤" width="640" height="400">
<h1>港町ロースターズの歩み</h1>
<h2>開業のきっかけ</h2>
<p>産地を訪ねるなかで、収穫したてのコーヒー豆の味わいに衝撃を受けたことが、焙煎所を開く大きなきっかけになりました。</p>
<h2>これから</h2>
<p>これからも、生産者の顔が見える豆を、適切な焙煎でお届けしていきます。</p>
