[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Force HTTPS for 2 years, including subdomains (safe once the domain is HTTPS-only).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Isolate the browsing context (mitigates cross-origin leaks / Spectre-class issues).
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "on"
    # Content Security Policy. 'unsafe-inline' on script/style is required by Next.js's
    # inline bootstrap + Tailwind style injection. Tightening script-src with per-request
    # nonces is the next step if you later add a custom server layer.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.anthropic.com; form-action 'self' mailto:; upgrade-insecure-requests"

# Decap CMS admin at /admin needs to call Netlify's API for Identity login
# and Git Gateway commits. Scoped to this one path only (Netlify resolves
# same-named headers by path specificity, so the site-wide policy above is
# untouched for every other page) rather than loosening the CSP globally.
# The CMS itself is self-hosted (public/admin/decap-cms.js), not CDN-loaded,
# so script-src stays 'self' here too.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "on"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.netlify.com; form-action 'self'; upgrade-insecure-requests"

# Public image filenames are stable rather than content-hashed, so use a useful
# browser cache window without marking them immutable. This avoids downloading
# portraits and mascot artwork again on every page visit while still allowing
# an updated asset to replace the same URL within a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
